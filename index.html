    <style id="mobile-enhancements">
      /* ===== Ajustes para uso em celular / telas sensíveis ao toque ===== */
      :root {
        --safe-top: env(safe-area-inset-top, 0px);
        --safe-bottom: env(safe-area-inset-bottom, 0px);
        --safe-left: env(safe-area-inset-left, 0px);
        --safe-right: env(safe-area-inset-right, 0px);
      }
      html { overscroll-behavior-y: none; -webkit-tap-highlight-color: transparent; }
      body { overflow-x: hidden; }
      .min-h-screen { min-height: 100dvh; }
      /* Header respeita o recorte (notch) em modo standalone */
      header.sticky { padding-top: var(--safe-top); }
      /* Rolagem horizontal suave em tabelas */
      .overflow-x-auto { -webkit-overflow-scrolling: touch; overscroll-behavior-x: contain; }

      /* Dispositivos de toque: alvos maiores e sem depender de hover */
      @media (hover: none) and (pointer: coarse) {
        button, [role="button"], summary, a.rounded-lg { min-height: 40px; }
        article .opacity-0 { opacity: 1; }
      }

      /* Telas menores que o breakpoint lg (1024px): layout de coluna única */
      @media (max-width: 1023.98px) {
        /* Painel de filtros deixa de ser sticky quando aparece acima dos resultados */
        aside > .sticky { position: static; top: auto; }
        /* Menus suspensos não estouram a tela */
        .w-72 { width: min(18rem, calc(100vw - 2rem)); }
      }

      /* Celulares (até 640px) */
      @media (max-width: 639.98px) {
        /* Evita zoom automático do iOS ao focar campos */
        input, select, textarea { font-size: 16px !important; }
        /* Cabeçalho mais compacto */
        header .flex-wrap { gap: 0.5rem; }
        header h1 { font-size: 14px; }
        header p.text-\[11px\] { display: none; }
        header nav { margin-left: auto; }
